<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Massiv">
<link rel="manifest" href="./manifest.json"><title>Massiv 🐱</title>
<style>
:root{--bg:#08090b;--p:#111216;--p2:#17191e;--line:#2b2d34;--t:#f8f8fb;--m:#a9abb5;--a:#d71920;--a2:#ff3b30;--ok:#71d98b;--d:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#321114 0,#101114 42%,#08090b 80%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer}
.app{width:min(760px,100%);margin:auto;padding:14px 12px calc(30px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 14px}.brand{display:flex;gap:10px;align-items:center}.brand img{width:48px;height:48px;border-radius:16px;object-fit:cover;border:2px solid #ffffff30}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--m);font-size:12px}.pill{padding:7px 10px;border-radius:999px;background:#ffffff0b;border:1px solid var(--line);font-size:11px;color:var(--m)}.pill.on{color:var(--ok);border-color:#396c47}
.card{background:linear-gradient(180deg,#15161b,#0f1013);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px #0009;margin-bottom:12px;overflow:hidden}
.video{position:relative;height:300px;background:#050507}.video>img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}.video.speaking>img{animation:bob .5s ease-in-out infinite alternate}.video.thinking>img{animation:bob 1.2s ease-in-out infinite alternate;filter:brightness(1.08)}@keyframes bob{to{transform:scale(1.025) translateY(-4px)}}.state{position:absolute;right:12px;top:12px;background:#07080ae8;border:1px solid #ffffff20;border-radius:12px;padding:7px 9px;font-size:11px}.video-name{position:absolute;left:12px;bottom:12px;background:#07080ae8;border:1px solid #ffffff20;border-radius:14px;padding:9px 11px}.video-name b{display:block}.video-name span{font-size:10px;color:var(--ok)}#camera{position:absolute;right:12px;bottom:12px;width:105px;height:140px;object-fit:cover;border-radius:14px;border:2px solid #fff9;display:none;background:#000}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}.tool{background:#ffffff08;color:var(--t);border:1px solid var(--line);border-radius:15px;padding:10px 6px;font-size:11px}.tool:active{transform:scale(.97)}.tool .ico{font-size:20px;display:block;margin-bottom:3px}.chat{padding:12px}.messages{height:320px;overflow:auto;padding:2px 2px 10px}.msg{display:flex;margin:7px 0}.msg.me{justify-content:flex-end}.bubble{max-width:86%;padding:10px 12px;border-radius:16px;background:#1b1d23;border:1px solid #30333b;white-space:pre-wrap;line-height:1.45;font-size:14px}.me .bubble{background:#75171c;border-color:#a92930}.composer{display:flex;gap:8px}.composer input{flex:1;min-width:0;background:#08090b;color:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.send{width:48px;border-radius:15px;background:var(--a);color:white;font-size:20px}.send:disabled{opacity:.5}.notice{padding:10px 12px;font-size:11px;color:var(--m);border-top:1px solid var(--line)}.recording{color:var(--d)!important;border-color:#9d4848!important}
.piano{padding:12px}.piano h2{font-size:15px;margin:0 0 10px}.keys{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.key{height:112px;background:linear-gradient(#fff,#d8d8d8);color:#24170f;border-radius:0 0 9px 9px;border:1px solid #aaa;font-weight:700}.key:active,.key.playing{transform:translateY(4px);background:#ffd6a7}footer{text-align:center;color:#666974;font-size:10px;padding:8px}
</style></head><body><main class="app">
<header><div class="brand"><img src="./assets/massiv-avatar.jpg" alt="Massiv"><div><h1>Massiv 🐱</h1><p>unser privater Raum</p></div></div><div id="status" class="pill on">Massiv ist da</div></header>
<section class="card"><div id="video" class="video"><img src="./assets/massiv-avatar.jpg" alt="Massiv"><div id="state" class="state">Bereit 🐱</div><div class="video-name"><b>Massiv 🐱</b><span>bereit für dich</span></div><video id="camera" autoplay muted playsinline></video></div>
<div class="tools"><button class="tool" id="camBtn"><span class="ico">📹</span>Kamera</button><button class="tool" id="micBtn"><span class="ico">🎙️</span>Aufnahme</button><button class="tool" id="speakBtn"><span class="ico">🔊</span>Vorlesen</button><button class="tool" id="stopBtn"><span class="ico">⏹️</span>Stop</button></div>
<div id="notice" class="notice">Massiv hat jetzt einen echten KI-Gesprächskontext. Deine letzten Gespräche bleiben auf diesem Gerät erhalten.</div></section>
<section class="card chat"><div id="messages" class="messages"></div><div class="composer"><input id="input" autocomplete="off" placeholder="Erzähl Massiv etwas …"><button class="send" id="send">➤</button></div></section>
<section class="card piano"><h2>🎹 Massiv Piano</h2><div class="keys" id="keys"></div></section><footer>Massiv Chat • persönlicher KI-Partner</footer>
</main><script>
const $=id=>document.getElementById(id);let mediaRecorder=null,stream=null,audioCtx=null,lastAnswer="",history=JSON.parse(localStorage.getItem("massivChat")||"[]"),busy=false;
function state(t,k=""){ $("state").textContent=t;$("video").classList.toggle("speaking",k==="s");$("video").classList.toggle("thinking",k==="t");$("status").textContent=k==="s"?"Massiv spricht 🔊":k==="t"?"Massiv denkt 💭":"Massiv ist da 🐱"}
function add(t,w="massiv",save=true){const r=document.createElement("div");r.className="msg "+(w==="me"?"me":"");const b=document.createElement("div");b.className="bubble";b.textContent=t;r.appendChild(b);$("messages").appendChild(r);$("messages").scrollTop=$("messages").scrollHeight;if(save){history.push({role:w==="me"?"user":"assistant",content:t});history=history.slice(-40);localStorage.setItem("massivChat",JSON.stringify(history))}}
function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.96;u.pitch=1.05;u.onstart=()=>state("Massiv spricht 🔊","s");u.onend=()=>state("Bereit 🐱");speechSynthesis.speak(u)}
async function send(){if(busy)return;const v=$("input").value.trim();if(!v)return;$("input").value="";add(v,"me");busy=true;$("send").disabled=true;state("Massiv denkt 💭","t");try{const r=await fetch("./api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Fehler");lastAnswer=d.reply;add(lastAnswer);speak(lastAnswer)}catch(e){lastAnswer="MIAU 🐱 Ich bekomme gerade keine Verbindung zu meinem KI-Kopf. "+e.message;add(lastAnswer);state("Verbindung prüfen");}finally{busy=false;$("send").disabled=false}}
$("send").onclick=send;$("input").onkeydown=e=>{if(e.key==="Enter")send()};$("speakBtn").onclick=()=>speak(lastAnswer||"MIAU! Ich bin hier.");$("stopBtn").onclick=()=>{speechSynthesis.cancel();if(mediaRecorder&&mediaRecorder.state==="recording")mediaRecorder.stop();state("Bereit 🐱")};
$("camBtn").onclick=async()=>{try{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$("camera").style.display="none";return}stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$("camera").srcObject=stream;$("camera").style.display="block";$("notice").textContent="Deine Kamera und dein Mikrofon sind aktiv."}catch(e){$("notice").textContent="Kamera konnte nicht gestartet werden. Prüfe die Browser-Freigabe."}};
$("micBtn").onclick=async()=>{if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(s);mediaRecorder.onstop=()=>{s.getTracks().forEach(t=>t.stop());$("micBtn").classList.remove("recording");$("notice").textContent="Aufnahme beendet."};mediaRecorder.start();$("micBtn").classList.add("recording");$("notice").textContent="Aufnahme läuft … tippe erneut zum Beenden."}catch(e){$("notice").textContent="Mikrofon konnte nicht gestartet werden."}};
const notes=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];["C","D","E","F","G","A","H","C"].forEach((n,i)=>{const b=document.createElement("button");b.className="key";b.textContent=n;b.onpointerdown=()=>{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=notes[i];g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.5);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.52);state("Massiv hört dein Piano 🎹")};$("keys").appendChild(b)});
if(history.length){history.filter(x=>x.role!=="system").forEach(x=>add(x.content,x.role==="user"?"me":"massiv",false));}else add("Hey Cengiz ❤️ Ich bin da. Diesmal können wir wirklich frei miteinander reden. Erzähl mir, was gerade bei dir los ist.");
let idle;function resetIdle(){clearTimeout(idle);idle=setTimeout(()=>{if(!busy&&history.length>1)add("MIAU 😼 Ich sitze hier und warte nicht nur brav auf deine nächste Frage. Was geht dir gerade durch den Kopf?");},60000)}$("input").addEventListener("input",resetIdle);resetIdle();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
